name: Sentinel monitor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      end_date:
        description: Exclusive UTC end date (YYYY-MM-DD); blank uses today
        type: string
      site_id:
        description: Optional single site ID
        type: string
      sites_profile:
        description: Locations and settings profile
        type: choice
        options: [configured, european-ports]
        default: configured
      sensors:
        description: Sensors to analyze
        type: choice
        options: [both, optical, radar]
        default: optical
      review_previews:
        description: Save previews for every usable comparison (live imagery only)
        type: boolean
        default: false
      optical_review_stretch:
        description: Shared optical preview range; needs review_previews and optical/both sensors
        type: boolean
        default: false
      demo:
        description: Use synthetic demo data without Google credentials
        type: boolean
        default: true
      refresh:
        description: Recompute the selected week for late-ingested imagery
        type: boolean
        default: false
      radar_diagnostics:
        description: Measure signed VV/VH shifts and baseline variability (extra compute)
        type: boolean
        default: false
      publish:
        description: Deploy the generated site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sentinel-${{ github.event_name == 'pull_request' && github.ref || 'publisher' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: ruff check . && ruff format --check src tests && pytest -q
      - run: sentinel-monitor validate
      - run: sentinel-monitor run --demo --end-date 2026-10-12
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-report
          path: site/

  list-publish:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Load existing live history without running Earth Engine
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git fetch origin results
            git worktree add --detach .history FETCH_HEAD
          else
            mkdir .history
          fi
      - name: Build the published list and retained results
        run: sentinel-monitor build --sites sites.yaml --results .history --output site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        id: pages
        with:
          path: site/

  monitor:
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.MONITOR_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    env:
      EE_PROJECT_ID: ${{ vars.EE_PROJECT_ID }}
      DEMO: ${{ inputs.demo || false }}
      END_DATE: ${{ inputs.end_date }}
      SITE_ID: ${{ inputs.site_id }}
      REFRESH: ${{ inputs.refresh || false }}
      SENSORS: ${{ inputs.sensors || 'optical' }}
      SITES_PROFILE: ${{ inputs.sites_profile || 'configured' }}
      REVIEW_PREVIEWS: ${{ inputs.review_previews || false }}
      OPTICAL_REVIEW_STRETCH: ${{ inputs.optical_review_stretch || false }}
      RADAR_DIAGNOSTICS: ${{ inputs.radar_diagnostics || false }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      EE_SERVICE_ACCOUNT: ${{ vars.EE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Check live configuration
        if: env.DEMO != 'true'
        shell: bash
        run: |
          if [[ -z "$EE_PROJECT_ID" || -z "$WIF_PROVIDER" || -z "$EE_SERVICE_ACCOUNT" ]]; then
            echo 'Set EE_PROJECT_ID, WIF_PROVIDER, and EE_SERVICE_ACCOUNT repository variables.' >&2
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: env.DEMO != 'true'
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.EE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.EE_PROJECT_ID }}
          create_credentials_file: true
      - name: Load persistent history
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git fetch origin results
            git worktree add --detach .history FETCH_HEAD
          else
            git worktree add --detach .history HEAD
            git -C .history switch --orphan results
          fi
      - name: Analyze selected locations and build report
        id: analysis
        continue-on-error: true
        shell: bash
        run: |
          args=(--results .history --output site --sensors "$SENSORS")
          case "$SITES_PROFILE" in
            configured) ;;
            european-ports)
              args+=(--sites pilots/european-ports/sites.yaml --settings pilots/european-ports/settings.yaml)
              ;;
            *)
              echo "Unknown sites profile: $SITES_PROFILE" >&2
              exit 1
              ;;
          esac
          if [[ "$DEMO" == true ]]; then args+=(--demo); fi
          if [[ -n "$END_DATE" ]]; then args+=(--end-date "$END_DATE"); fi
          if [[ -n "$SITE_ID" ]]; then args+=(--site-id "$SITE_ID"); fi
          if [[ "$REFRESH" == true ]]; then args+=(--refresh); fi
          if [[ "$REVIEW_PREVIEWS" == true ]]; then args+=(--review-previews); fi
          if [[ "$OPTICAL_REVIEW_STRETCH" == true ]]; then args+=(--optical-review-stretch); fi
          if [[ "$RADAR_DIAGNOSTICS" == true ]]; then args+=(--radar-diagnostics); fi
          set +e
          sentinel-monitor run "${args[@]}"
          status=$?
          if [[ -f site/index.html ]]; then echo 'built=true' >> "$GITHUB_OUTPUT"; fi
          exit "$status"
      - name: Save live history, including partial failures
        if: steps.analysis.outputs.built == 'true' && env.DEMO != 'true'
        shell: bash
        run: |
          git -C .history config user.name 'github-actions[bot]'
          git -C .history config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .history add -- live run-summary.json
          if ! git -C .history diff --cached --quiet; then
            git -C .history commit -m 'Save Sentinel monitoring results'
            git -C .history push origin HEAD:refs/heads/results
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.analysis.outputs.built == 'true'
        with:
          name: monitoring-report
          path: |
            site/
            .history/run-summary.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        id: pages
        if: >-
          steps.analysis.outputs.built == 'true' &&
          (github.event_name == 'schedule' || inputs.publish)
        with:
          path: site/
      - name: Surface partial analysis failures
        if: steps.analysis.outcome == 'failure'
        run: |
          echo "::error::Image analysis failed. Expand 'Analyze selected locations and build report' for the service error, or inspect monitoring-report/site/history.json."
          exit 1

  deploy:
    needs: [monitor, list-publish]
    if: >-
      always() &&
      (needs.monitor.outputs.pages_ready == 'true' ||
       needs.list-publish.outputs.pages_ready == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
